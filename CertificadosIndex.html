<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal do Aluno - Javis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/meuscursos.css" />
</head>
<body class="min-h-screen flex flex-col">

    <main class="flex-grow p-4 md:p-8 flex justify-center">
        <div class="container max-w-7xl neon-container rounded-xl p-6 md:p-8">
            <header class="mb-8 border-b border-[#333] pb-4">
                <h1 class="text-3xl font-bold text-[#f5f5f5] flex items-center gap-3">
                    <i class="fas fa-trophy text-[#00FFFF]"></i>
                    Certificados Conquistados
                </h1>
                <p class="text-gray-500 mt-2">Acompanhe suas conquistas e saiba quando seu certificado estará disponível para retirada!</p>
            </header>

            <div id="certificados-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                </div>

            <div class="mt-8 p-4 bg-[#1a1a1a] border-l-4 border-yellow-500 rounded-r shadow-lg">
                <p class="text-gray-400 text-sm flex items-center gap-3">
                    <i class="fas fa-info-circle text-yellow-500 text-lg"></i>
                    Os certificados são liberados após a conclusão de **100%** do conteúdo. <b>A retirada do documento oficial impresso deve ser feita presencialmente na secretaria da unidade.</b>
                </p>
            </div>

        </div>
    </main>
    <script>
        // Lógica do Mobile Menu e User Dropdown
        document.addEventListener('DOMContentLoaded', function () {
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            const navMenu = document.querySelector('.nav-menu');
            const userProfile = document.querySelector('.user-profile');
            const userDropdown = document.querySelector('.user-dropdown');
            
            if(mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', () => navMenu.classList.toggle('active'));
            }

            if(userProfile) {
                userProfile.addEventListener('click', (e) => {
                    e.stopPropagation();
                    userDropdown.classList.toggle('active');
                });
            }

            document.addEventListener('click', () => {
                if(userDropdown) userDropdown.classList.remove('active');
            });
        });
    </script>
    <script src="js/aluno/config.js"></script>
    <script src="js/aluno/navbar.js"></script>
    <script src="js/aluno/certificados.js"></script>
</body>
</html>
