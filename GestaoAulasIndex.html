<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Aulas (Canva) - Javis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .table-container { background-color: #1a1a1a; border-radius: 8px; border: 1px solid #333; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; color: #e5e7eb; font-size: 14px; }
        th { background-color: #111; font-weight: 600; color: #00FFFF; text-transform: uppercase; font-size: 12px; }
        tr:hover { background-color: #222; }
    </style>
</head>
<body class="bg-[#111] text-white flex min-h-screen">
    
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 lg:ml-64">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-[#00FFFF]"><i class="fas fa-link mr-2"></i> Links das Aulas</h1>
                <p class="text-gray-400 text-sm mt-1">Atualize os links do Canva para todas as aulas do sistema.</p>
            </div>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Pesquisar aula ou curso..." class="bg-[#1a1a1a] border border-[#333] text-white text-sm rounded-lg focus:ring-[#00FFFF] focus:border-[#00FFFF] block w-64 pl-10 p-2.5">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
            </div>
        </header>

        <div class="table-container shadow-lg">
            <table id="aulasTable">
                <thead>
                    <tr>
                        <th class="w-16">ID</th>
                        <th class="w-48">Curso</th>
                        <th>Título da Aula</th>
                        <th class="w-96">Link do Canva / Conteúdo</th>
                        <th class="w-24 text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="aulasTableBody">
                    <tr><td colspan="5" class="text-center py-8"><i class="fas fa-spinner fa-spin text-[#00FFFF] text-2xl"></i></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-[#1a1a1a] border border-[#00FFFF] rounded-lg p-6 w-full max-w-2xl shadow-[0_0_20px_rgba(0,255,255,0.2)]">
            <h3 class="text-xl font-bold text-white mb-4">Editar Conteúdo da Aula <span id="modalAulaId" class="text-[#00FFFF]"></span></h3>
            <p id="modalAulaTitulo" class="text-sm text-gray-400 mb-4 font-bold"></p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-2">Link do Canva (ou Texto)</label>
                <textarea id="modalConteudo" rows="4" class="bg-[#111] border border-[#333] text-white text-sm rounded-lg focus:ring-[#00FFFF] focus:border-[#00FFFF] block w-full p-2.5" placeholder="Cole o link de embed do Canva aqui..."></textarea>
            </div>
            
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="fecharModal()" class="px-4 py-2 text-sm text-gray-300 bg-[#333] hover:bg-[#444] rounded-lg transition">Cancelar</button>
                <button onclick="salvarConteudo()" class="px-4 py-2 text-sm text-black font-bold bg-[#00FFFF] hover:bg-cyan-400 rounded-lg transition shadow-[0_0_10px_rgba(0,255,255,0.3)]">Salvar Link</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initSidebar } from './js/funcionario/ui.js';
        document.addEventListener('DOMContentLoaded', initSidebar);
    </script>
    <script type="module" src="js/funcionario/gestao-aulas.js"></script>
</body>
</html>
